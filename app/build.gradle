plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ct3.emu'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ct3.emu'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.16.0'
}

// Renames the generated APK file itself (what you see after downloading
// the CI artifact / installing it), independent of the app's display
// name (android:label) and package id (applicationId).
android.applicationVariants.all { variant ->
    variant.outputs.all { output ->
        outputFileName = "Captain Tsubasa III - Koutei no Chousen ITA.apk"
    }
}
