name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept all SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install platform + build-tools
        run: sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-version: '8.7'

      - name: Build debug APK with Build Scan
        run: gradle assembleDebug --no-daemon --stacktrace --scan

      - name: Verify APK was produced
        id: verify_apk
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          if [ -z "${APK}" ]; then
            echo "::error::No APK found in app/build/outputs/apk/debug - build silently produced nothing."
            exit 1
          fi
          SIZE=$(du -h "${APK}" | cut -f1)
          echo "Built: ${APK} (${SIZE})"
          echo "apk_path=${APK}" >> "$GITHUB_OUTPUT"
          echo "apk_size=${SIZE}" >> "$GITHUB_OUTPUT"

      - name: Write build summary
        run: |
          {
            echo "### CT3Emu build succeeded ✅"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| APK | \`${{ steps.verify_apk.outputs.apk_path }}\` |"
            echo "| Size | ${{ steps.verify_apk.outputs.apk_size }} |"
            echo ""
            echo "Download it from the **Artifacts** section of this run."
            echo ""
            echo "## 🎮 App Features:"
            echo "- 📱 **Orientamento**: Landscape (Orizzontale)"
            echo "- 💾 **Storage**: LocalStorage + IndexedDB + Internal Storage"
            echo "- 🌐 **Internet**: Abilitato"
            echo "- 🎮 **JavaScript**: Funzionante"
            echo ""
            echo "**Build Scan:** https://scans.gradle.com"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CT3Emu-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
