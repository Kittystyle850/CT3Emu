name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

# If you push twice quickly, cancel the older run instead of wasting minutes
# building an APK you're about to replace anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "26.1.10909125"
  ABIS: "armeabi-v7a arm64-v8a x86_64"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Checkout snes9x2010 libretro core
        uses: actions/checkout@v4
        with:
          repository: libretro/snes9x2010
          path: snes9x2010

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (cmdline-tools, platform, build-tools)
        uses: android-actions/setup-android@v3

      # Belt-and-braces: accept licenses explicitly even though the action
      # above normally does it, so a future action-version change can't
      # silently break the build on a license prompt.
      - name: Accept all SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install NDK + CMake + platform via sdkmanager
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;${NDK_VERSION}" "cmake;3.22.1" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Verify NDK install
        run: |
          set -euo pipefail
          if [ ! -x "${ANDROID_NDK_HOME}/ndk-build" ]; then
            echo "::error::ndk-build not found at ${ANDROID_NDK_HOME} - NDK install failed or version ${NDK_VERSION} was renamed/removed upstream."
            exit 1
          fi
          echo "NDK OK: ${ANDROID_NDK_HOME}"

      - name: Build libretro core for all target ABIs
        working-directory: snes9x2010
        run: |
          set -euo pipefail
          CORE_ROOT="$(pwd)"
          for ABI in ${ABIS}; do
            echo "== Building core for ${ABI} =="
            # NDK_PROJECT_PATH and APP_BUILD_SCRIPT must be ABSOLUTE here.
            # This core's Android.mk computes LOCAL_PATH via $(call my-dir),
            # then builds source paths as $(LOCAL_PATH)/../src/foo.c. If
            # ndk-build is invoked with a relative project path, LOCAL_PATH
            # stays relative too, and ndk-build's internal logic (which only
            # skips re-prepending LOCAL_PATH for already-absolute source
            # paths) ends up prepending it a second time, producing bogus
            # doubled targets like "jni/jni/../src/apu.c". Absolute paths
            # make every source path already-absolute, so it's never
            # re-prepended. (Verified by reproducing the exact failure with
            # a minimal GNU Make script before landing this fix.)
            "${ANDROID_NDK_HOME}/ndk-build" \
              NDK_PROJECT_PATH="${CORE_ROOT}" \
              APP_BUILD_SCRIPT="${CORE_ROOT}/jni/Android.mk" \
              APP_ABI=${ABI} \
              APP_PLATFORM=android-24 \
              NDK_LIBS_OUT="${CORE_ROOT}/libs" \
              NDK_OUT="${CORE_ROOT}/obj"
            if [ ! -f "./libs/${ABI}/libretro.so" ]; then
              echo "::error::Core build for ${ABI} did not produce libs/${ABI}/libretro.so"
              exit 1
            fi
          done

      - name: Stage core .so files into app assets
        run: |
          set -euo pipefail
          for ABI in ${ABIS}; do
            mkdir -p "app/src/main/assets/cores/${ABI}"
            cp "snes9x2010/libs/${ABI}/libretro.so" "app/src/main/assets/cores/${ABI}/libretro.so"
          done
          echo "Staged core binaries:"
          find app/src/main/assets/cores -type f -exec ls -lh {} \;

      - name: Set up Gradle (with dependency + build cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          # Pinned to match AGP 8.5.2's supported range. Without this,
          # setup-gradle installs whatever the latest Gradle release is
          # (it grabbed 9.7.1 once), which AGP 8.5.2 does not support and
          # fails with unrelated-looking Groovy/DSL errors.
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK was produced
        id: verify_apk
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          if [ -z "${APK}" ]; then
            echo "::error::No APK found in app/build/outputs/apk/debug - build silently produced nothing."
            exit 1
          fi
          SIZE=$(du -h "${APK}" | cut -f1)
          echo "Built: ${APK} (${SIZE})"
          echo "apk_path=${APK}" >> "$GITHUB_OUTPUT"
          echo "apk_size=${SIZE}" >> "$GITHUB_OUTPUT"

      - name: Write build summary
        run: |
          {
            echo "### CT3Emu build succeeded ✅"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| APK | \`${{ steps.verify_apk.outputs.apk_path }}\` |"
            echo "| Size | ${{ steps.verify_apk.outputs.apk_size }} |"
            echo "| ABIs | ${ABIS} |"
            echo "| NDK | ${NDK_VERSION} |"
            echo ""
            echo "Download it from the **Artifacts** section of this run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CT3Emu-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
