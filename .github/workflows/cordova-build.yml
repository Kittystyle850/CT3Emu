name: Build APK with Cordova

on:
  push:
    branches: [siuunoh]
  workflow_dispatch:

concurrency:
  group: cordova-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          # No npm cache here: this project intentionally does not commit
          # package-lock.json, so setup-node cannot restore a lockfile-based cache.

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: npx cordova platform add android@13.0.0

      - name: Build debug APK
        run: npx cordova build android --debug --no-telemetry

      - name: Verify APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find platforms/android/app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$APK" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "APK: $APK"

      - name: Build summary
        run: |
          {
            echo "## CT3Emu APK ✅"
            echo
            echo "- **APK:** \`${{ steps.apk.outputs.path }}\`"
            echo "- **Size:** ${{ steps.apk.outputs.size }}"
            echo "- **Node:** 24"
            echo "- **Java:** 17"
            echo "- **Orientation:** landscape"
            echo "- **App shell:** Cordova only"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: CT3Emu-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
